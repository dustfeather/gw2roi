name: deploy

# A shim over dustfeather/shared-workflows' deploy-k8s.yml. GitHub is still the
# single source of truth for cluster secrets; the shared workflow runs on the
# in-cluster ARC runner (SA arc-df-gw2roi-gha-rs-no-permission, bound to the
# gw2-ci-deployer Role), pushes GitHub Actions Secrets into the trading ns, and
# applies the ConfigMap + CronJob. kubectl uses the pod's in-cluster config.
#
# This repo was carved out of issue #18's rollout because it needs TWO distinct
# Secrets, one of them mixing secret and non-secret literals — which a single
# SECRET_LITERALS blob cannot express. The shared workflow's SECRETS_MANIFEST
# input is what closed that gap: one blob, a `[name]` header per Secret.
#
# Required GitHub Actions Secrets (Settings > Secrets and variables > Actions):
#   ARENA_NET_KEY   - ArenaNet API key (account,characters,unlocks,inventories scopes)
#   PG_PASSWORD     - password for the dedicated Postgres (bot + StatefulSet share it)
# (Grafana provisioning is local-only — see scripts/provision-grafana.sh; no GH secret needed.)
#
# NOT deployed here (bootstrap once with admin kubeconfig — Role lacks these verbs):
#   k8s/rbac.yaml, k8s/postgres.yaml, the arc-df-gw2roi runner scale set.

on:
  # After a new image is built...
  workflow_run:
    workflows: ["build-and-push"]
    types: [completed]
    branches: [main]
  # ...and independently, whenever the manifests themselves change. Without this trigger a
  # manifest-only commit reaches the cluster only if some *other* commit happens to rebuild
  # the image: build-and-push filters on src/**, data/**, Dockerfile, package.json, so
  # editing k8s/cronjob.yaml alone fires nothing at all. That is how the 2026-08-10 CronJob
  # retry fix sat committed and unapplied while every slow hour kept stranding itself.
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - "scripts/kick-init-job.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gw2roi
  cancel-in-progress: false

jobs:
  deploy:
    # Gate only the image-driven path on a green build. A push/dispatch deploy applies the
    # manifests already in git against whatever image is current, so a red or rate-limited
    # build must not be able to block it.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    uses: dustfeather/shared-workflows/.github/workflows/deploy-k8s.yml@v4
    with:
      namespace: trading
      runner: arc-df-gw2roi # in-cluster ARC runner scale set (create at bootstrap)
      # `none`, not the `get` default: gw2-ci-deployer is a namespace-scoped
      # Role, and reading a Namespace is a cluster-scoped verb it does not have.
      # The previous hand-written job never checked either.
      ensure-namespace: none
      manifests: |
        k8s/configmap.yaml
        k8s/cronjob.yaml
      # The StatefulSet itself is bootstrap-only, so this waits on an object
      # this job did not apply — deliberately. The init job below writes to
      # Postgres, so a deploy that raced it would fail for a reason that has
      # nothing to do with the deploy.
      rollout-targets: statefulset/gw2-postgres
      rollout-timeout: 180s
      # Runs after the rollout wait, and a non-zero exit fails the deploy:
      # populate craft_roi now rather than leaving the table empty until the
      # next scheduled slot.
      verify-command: bash scripts/kick-init-job.sh
      show-command: kubectl get cronjob gw2-crafting-roi -o wide
    secrets:
      # Two Secrets, hence SECRETS_MANIFEST rather than secret-name +
      # SECRET_LITERALS. gw2-postgres-creds mixes the password with the
      # non-secret user and database names on purpose: it is consumed by BOTH
      # the StatefulSet and the bot, which expect one Secret, not two.
      SECRETS_MANIFEST: |
        [gw2-api-key]
        ARENA_NET_KEY=${{ secrets.ARENA_NET_KEY }}

        [gw2-postgres-creds]
        POSTGRES_USER=gw2
        POSTGRES_DB=gw2
        POSTGRES_PASSWORD=${{ secrets.PG_PASSWORD }}
        PGUSER=gw2
        PGDATABASE=gw2
        PGPASSWORD=${{ secrets.PG_PASSWORD }}

  # Grafana dashboards/datasource are NOT provisioned from CI.
  # They live in git (k8s/grafana/dashboards/) and are pushed on demand,
  # locally, via: scripts/provision-grafana.sh  (reads GRAFANA_API_KEY + PG_PASSWORD from .env)
