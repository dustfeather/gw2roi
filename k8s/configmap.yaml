# Non-secret tuning: gates (§6) + ranking size. Edit + re-apply to retune; next CronJob run picks it up.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gw2-roi-config
  namespace: trading
data:
  TOP_N: "100"
  TP_KEEP_RATIO: "0.85"
  # Trailing window the demand velocity is averaged over: 1d | 2d | 7d.
  # Gates below stay per-DAY whichever window is picked.
  VELOCITY_WINDOW: "7d"
  GATE_MIN_SELL_SOLD_DAY: "10"
  # Listed sell-side supply ahead of you, in days. Was 7, which sat BELOW the entire
  # distribution of otherwise-qualifying recipes (p10 = 12.3d) and admitted ~nothing
  # except on a 1d-velocity noise spike. 14 keeps only the fastest-clearing decile.
  GATE_MAX_DAYS_TO_SELL: "14"
  GATE_MIN_ROI_PCT: "10"
  GATE_MIN_PROFIT_COPPER: "100"
  # Recipe definitions are cached in Postgres (recipe_defs) and only topped up: ids the
  # cache has never seen, plus this many oldest-first re-reads per run. Fetching all ~13k
  # every hour was 66 chunked requests whose wall time swung 328s-612s on upstream latency
  # alone, which is what kept pushing runs past the pod deadline. 600/run re-reads the whole
  # table over about a day at 3 requests an hour. Raise it to converge faster after a game
  # patch; 0 disables refresh entirely (new ids are still always fetched).
  RECIPE_REFRESH_PER_RUN: "600"
  PGHOST: "gw2-postgres"
  PGPORT: "5432"
