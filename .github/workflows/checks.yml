name: checks

on:
  pull_request:
    # `closed` is in this list to cancel this workflow's own in-flight run when
    # the PR merges. A merge fires no `synchronize`, so without it nothing ever
    # re-enters the concurrency group below, and the review job keeps a
    # self-hosted runner busy on a commit that is already history. Every job is
    # gated off `closed`, so the run this creates does no work: it exists only
    # to claim the group and cancel its predecessor.
    types: [opened, synchronize, reopened, closed]
# Push-to-main typecheck runs inside deploy.yml, where it gates the deploy,
# so this workflow only needs to cover PRs.

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    # Skipped on `closed` — see the `types:` note above.
    if: github.event.action != 'closed'
    # Reusable node CI from shared-workflows. pnpm-lock.yaml present -> auto-detects pnpm,
    # runs `pnpm typecheck`, which recurses into both Workers and packages/core.
    # Only typecheck is meaningful here (no lint or test scripts in this repo).
    uses: dustfeather/shared-workflows/.github/workflows/node-test.yml@v7
    with:
      runner: arc-df-gw2roi
      pnpm-version: "10.33.4"
      run-typecheck: true
      run-lint: false
      run-test: false
      run-audit: false
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  review:
    if: github.event.action != 'closed'
    needs: node
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: dustfeather/shared-workflows/.github/workflows/claude-code-review.yml@v7
    with:
      runner: arc-df-gw2roi
    secrets: inherit
