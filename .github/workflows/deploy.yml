name: deploy

# Two Workers, deployed by dustfeather/shared-workflows' deploy-cloudflare.yml.
#
#   gw2-roi-cron  scheduled() only, no route, holds ARENA_NET_KEY, writes D1
#   gw2-roi-web   fetch() only, custom domain gw2.itguys.ro behind Access, reads D1
#
# Required GitHub Actions Secrets (Settings > Secrets and variables > Actions):
#   ARENA_NET_KEY          - ArenaNet API key (account,characters,unlocks,inventories,
#                            tradingpost,wallet scopes). Shipped onto the cron Worker with
#                            the deploy via WORKER_SECRETS.
#   CLOUDFLARE_API_TOKEN   - Workers + D1 edit
#   CLOUDFLARE_ACCOUNT_ID
#
# NOT done here (one-off, by hand): creating the D1 database, importing the cutover dumps,
# and creating the Access application + custom domain. All three are done; the runbook for them
# is in the deleted migration record, `git show b90f556:docs/PLAN-cloudflare-migration.md` §7.

on:
  push:
    branches: [main]
    # A deny-list, not an allow-list: failing closed on documentation is cheap, failing open
    # on code is not. The old k8s deploy needed a second `paths:` trigger precisely because an
    # allow-list let manifest-only commits reach main unapplied.
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read

# Newest merge wins. A cancel landing between the two Worker deploys can leave
# them on different commits, but the run that did the cancelling deploys both
# itself, in the same order, off the newer commit — so the split closes on its
# own, and sooner than queueing behind a superseded run would have.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # Gates both deploys. There is no test suite and no linter — typecheck is the only check,
  # and it is the same one the pre-commit hook runs.
  typecheck:
    permissions:
      contents: read
    uses: dustfeather/shared-workflows/.github/workflows/node-test.yml@v4
    with:
      runner: arc-df-gw2roi
      pnpm-version: "10.33.4"
      run-typecheck: true
      run-lint: false
      run-test: false
      run-audit: false
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-cron:
    needs: typecheck
    permissions:
      contents: read
    uses: dustfeather/shared-workflows/.github/workflows/deploy-cloudflare.yml@v4
    with:
      working-dir: apps/cron
      # Monorepo: the lockfile and node_modules live at the root, the wrangler config does not.
      install-dir: .
      runner: arc-df-gw2roi
      pnpm-version: "10.33.4"
      # Migrations run BEFORE the new code goes live, and only here. Under the old inline-DDL
      # model the first invocation after a deploy carried the DDL, which turned a schema failure
      # into a failed *run* rather than a failed *deploy*.
      #
      # deploy-web no longer waits on this job, so the two deploys race: the board can go live a
      # few seconds before a pending migration finishes. That is a deliberate trade for wall
      # time. It only bites on a deploy that BOTH adds a migration AND ships web code depending
      # on it, and it self-heals on the next request once the migration lands. If that stops
      # being acceptable, the fix is a separate `migrate` job that both deploys declare in
      # `needs`, not restoring the deploy-cron -> deploy-web chain.
      pre-deploy-command: npx wrangler d1 migrations apply gw2 --remote
      max-gzip-kib: 600
      max-startup-ms: 400
      # The gate that matters for a cron-only Worker. wrangler treats an absent `triggers`
      # block as "leave whatever is registered alone", so a misplaced or unread config section
      # deploys clean with zero schedules and surfaces an hour later as "the job never ran".
      # This asserts the end state on the account after the upload.
      expect-crons: 0 * * * *
      # No verify-url: this Worker has no HTTP route by design.
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_SECRETS: |
        ARENA_NET_KEY=${{ secrets.ARENA_NET_KEY }}

  deploy-web:
    # Parallel with deploy-cron, both gated only on typecheck. See the migration note above for
    # what that gives up.
    needs: typecheck
    permissions:
      contents: read
    uses: dustfeather/shared-workflows/.github/workflows/deploy-cloudflare.yml@v4
    with:
      working-dir: apps/web
      install-dir: .
      runner: arc-df-gw2roi
      pnpm-version: "10.33.4"
      # Rebuilds the committed Tailwind Text module, so a class added in a .tsx cannot ship
      # against stale CSS.
      build-command: pnpm build:css
      max-gzip-kib: 900
      max-startup-ms: 400
      # No verify-url: the board is behind Cloudflare Access, so an unauthenticated curl gets
      # a 302 to the login page and would fail every deploy. The deploy gate's scope here is
      # "did the deployment go through", which wrangler's exit code plus the size and startup
      # gates already cover.
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
