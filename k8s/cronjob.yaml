# Hourly ROI recompute. Latest-only: each run TRUNCATE+INSERTs craft_roi.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gw2-crafting-roi
  namespace: trading
spec:
  schedule: "0 * * * *" # hourly
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Up to 3 attempts. The Job controller re-creates the pod on its own exponential
      # backoff (~10s, then ~20s), so a failed run retries within a minute instead of
      # waiting for the next hourly tick.
      backoffLimit: 2
      # Outer backstop ONLY for a pod that never starts (unschedulable, image pull wedged) —
      # the pod-level deadline below never fires for a pod that isn't running, and
      # concurrencyPolicy: Forbid would then skip every following hourly run. Must stay well
      # above 3 x the pod cap or it would swallow the retries: a job-level deadline marks the
      # Job Failed outright, with no replacement pod, which is exactly what stranded the
      # 2026-08-10 19:00 run.
      activeDeadlineSeconds: 3300 # 55 min
      template:
        spec:
          restartPolicy: Never
          # 15 min cap PER ATTEMPT, at pod level so blowing it counts as a retryable pod
          # failure rather than killing the Job outright. Runs sit at 11-13 min, so this is
          # tight by design: it trips on a hung run, and the retry gets a fresh shot.
          activeDeadlineSeconds: 900
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: bot
              image: ghcr.io/dustfeather/gw2-crafting-roi-bot:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: gw2-roi-config
                - secretRef:
                    name: gw2-api-key # ARENA_NET_KEY
                - secretRef:
                    name: gw2-postgres-creds # PGUSER/PGPASSWORD/PGDATABASE
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 512Mi }
