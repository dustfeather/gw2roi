name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "Dockerfile"
      - "package.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dustfeather/gw2-crafting-roi-bot

jobs:
  typecheck:
    # Gate the image build on a passing typecheck. Reusable node-test auto-detects
    # bun from bun.lock and runs `bun run typecheck`.
    uses: dustfeather/shared-workflows/.github/workflows/node-test.yml@v4
    with:
      runner: ubuntu-latest
      run-typecheck: true
      run-lint: false
      run-test: false
      run-audit: false

  build:
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push are split so a failed push is retried on its own. GHCR answers pushes
      # with `403 Forbidden - "You have exceeded a secondary rate limit"` under account-wide
      # write pressure; that killed the 2026-08-10 build, which skipped the deploy, which is
      # why a CronJob fix committed that day never reached the cluster. The registry's own
      # advice is to wait and retry, so that is what this does — without paying for a rebuild.
      - name: Build (load into the local daemon, don't push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to GHCR (retry the transient secondary rate limit)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -uo pipefail
          # Push tags one at a time: a partial failure then only retries what is left.
          for tag in $TAGS; do
            pushed=""
            for delay in 0 60 180 300; do
              [ "$delay" -gt 0 ] && { echo "retrying $tag in ${delay}s"; sleep "$delay"; }
              if docker push "$tag"; then pushed=1; break; fi
            done
            [ -n "$pushed" ] || { echo "::error::giving up on $tag after 4 attempts"; exit 1; }
          done
